name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run backend tests
        working-directory: backend-spring
        run: mvn test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend-react
        run: npm test -- --watchAll=false

  build-and-push:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-spring
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bike-service-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/bike-service-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-react
          push: true
          build-args: |
            REACT_APP_API_URL=https://bikeservice.duckdns.org/api
          tags: |
            ghcr.io/${{ github.repository_owner }}/bike-service-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/bike-service-frontend:latest

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    env:
      DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
      HOMELAB_IPV6: ${{ vars.HOMELAB_IPV6 }}
      ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Update DuckDNS IPv4 and IPv6 records
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${HOMELAB_IPV6}" ]]; then
            echo "HOMELAB_IPV6 repository variable is not configured."
            exit 1
          fi

          PUBLIC_IPV4="$(curl --ipv4 --fail --silent --show-error https://api.ipify.org)"
          RESPONSE="$(curl --fail --silent --show-error --get https://www.duckdns.org/update \
            --data-urlencode "domains=bikeservice" \
            --data-urlencode "token=${DUCKDNS_TOKEN}" \
            --data-urlencode "ip=${PUBLIC_IPV4}" \
            --data-urlencode "ipv6=${HOMELAB_IPV6}")"

          if [[ "${RESPONSE}" != "OK" ]]; then
            echo "DuckDNS update failed: ${RESPONSE}"
            exit 1
          fi

          echo "DuckDNS IPv4 and IPv6 records updated successfully."

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create production .env file
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          cat > .env << EOF
          DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
          ACME_EMAIL=${ACME_EMAIL}
          DB_PASSWORD=${DB_PASSWORD}
          JWT_SECRET_KEY=${JWT_SECRET_KEY}
          EOF

      - name: Pull latest images and restart
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.prod.yml pull
          docker compose -f docker-compose.yaml -f docker-compose.prod.yml up -d
